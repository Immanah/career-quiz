<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Your Goals</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;500&display=swap"
            rel="stylesheet"
        />
        <style>
            body {
                margin: 0;
                padding: 0;
                font-family: "Raleway", sans-serif;
                background: linear-gradient(135deg, #f0f4fd, #e2e8f0);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
            }
            h1,
            h2 {
                color: #333;
                text-align: center;
            }
            form {
                background: #fff;
                padding: 2rem;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
                max-width: 400px;
                width: 100%;
                margin-bottom: 2rem;
            }
            form label,
            input {
                display: block;
                width: 100%;
                margin-bottom: 1rem;
            }
            input[type="text"],
            input[type="submit"] {
                padding: 1rem;
                border-radius: 10px;
                border: none;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            }
            input[type="submit"] {
                background-color: #6c63ff;
                color: white;
                cursor: pointer;
                transition: background-color 0.3s ease;
            }
            input[type="submit"]:hover {
                background-color: #594aff;
            }
            .goals-container {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                margin-top: 2rem;
                gap: 1rem; /* Space between bubbles */
            }
            .goal-bubble {
                background-color: #fff;
                padding: 1rem;
                border-radius: 15px;
                box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
                font-size: 1rem;
                min-width: 150px; /* Minimum width for bubbles */
                text-align: center; /* Center text */
            }
        </style>
    </head>
    <body>
        <script src="firebase.js"></script>

        <h1>Set Your Goals</h1>
        <form id="goals-form">
            <label for="goal">Goal:</label>
            <input type="text" id="goal" required />

            <label for="timeline">Timeline:</label>
            <input type="text" id="timeline" required />

            <input type="submit" value="Add Goal" />
        </form>

        <h2>Your Goals</h2>
        <div class="goals-container" id="goals-list"></div>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const goalsList = document.getElementById("goals-list");
                const savedGoals =
                    JSON.parse(localStorage.getItem("goals")) || [];

                // Function to render goals
                function renderGoals() {
                    goalsList.innerHTML = ""; // Clear existing list
                    savedGoals.forEach((goal, index) => {
                        const div = document.createElement("div");
                        div.classList.add("goal-bubble");
                        div.innerHTML = `
                            Goal: ${goal.text} | Timeline: ${goal.timeline}
                            <br>
                            <button onclick="editGoal(${index})">Edit</button>
                            <button onclick="deleteGoal(${index})">Delete</button>
                        `;
                        goalsList.appendChild(div);
                    });
                }

                // Load saved goals from local storage
                renderGoals();

                // Add new goal
                document
                    .getElementById("goals-form")
                    .addEventListener("submit", function (event) {
                        event.preventDefault();
                        const goalInput = document.getElementById("goal").value;
                        const timelineInput =
                            document.getElementById("timeline").value;

                        // Create a new goal object
                        savedGoals.push({
                            text: goalInput,
                            timeline: timelineInput,
                        });
                        localStorage.setItem(
                            "goals",
                            JSON.stringify(savedGoals),
                        );

                        // Clear input fields and re-render goals
                        document.getElementById("goal").value = "";
                        document.getElementById("timeline").value = "";
                        renderGoals();
                    });

                // Edit goal function
                window.editGoal = function (index) {
                    const goal = savedGoals[index];
                    document.getElementById("goal").value = goal.text;
                    document.getElementById("timeline").value = goal.timeline;
                    // Remove goal and re-render after edit
                    deleteGoal(index);
                };

                // Delete goal function
                window.deleteGoal = function (index) {
                    savedGoals.splice(index, 1);
                    localStorage.setItem("goals", JSON.stringify(savedGoals));
                    renderGoals();
                };
            });
        </script>
    </body>
</html>
